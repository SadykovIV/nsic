name: Feature request
description: Propose an NSIC workflow or usability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Scope
      options:
        - label: This request does not require bundling keys or copyrighted game data.
          required: true
