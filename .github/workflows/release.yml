name: macOS ARM64 release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --target aarch64-apple-darwin
      - name: Stage application
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Nintendo Switch Image Converter.app"
          codesign --force --deep --sign - "$app"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/NSIC-${GITHUB_REF_NAME}-macos-arm64.zip"
          ./scripts/check_release_contents.sh "release/NSIC-${GITHUB_REF_NAME}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NSIC-${{ github.ref_name }}-macos-arm64
          path: release/*.zip
          if-no-files-found: error
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip --draft --generate-notes --title "NSIC ${GITHUB_REF_NAME}"
